services:
  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_MINIO_URL=http://localhost:9000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - facetory-network

  # Backend API
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://facetory_user:facetory_pass@postgres:5432/facetory_db
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGINS=["http://localhost:3000"]
      - SELENIUM_URL=http://selenium:4444/wd/hub 
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./backend/weights/.deepface/weights:/root/.deepface/weights:ro
    depends_on:
      - postgres
      - minio
      - redis
      - selenium
    networks:
      - facetory-network
    shm_size: '8gb'
    deploy:
      resources:
        limits:
          memory: 16G

  # Database
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=facetory_db
      - POSTGRES_USER=facetory_user
      - POSTGRES_PASSWORD=facetory_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - facetory-network

  # Object Storage
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - facetory-network

  # Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - facetory-network
  # Selenium Grid (Standalone Chrome)
  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"  # Selenium server
      - "7900:7900"  # VNC viewer (để debug)
    environment:
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_VNC_NO_PASSWORD=1
    shm_size: '2gb'  # Quan trọng cho Chrome
    networks:
      - facetory-network
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  facetory-network:
    driver: bridge 